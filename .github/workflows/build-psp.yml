name: Build PSP diagnostic EBOOT
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'GTAVC-WIP9-cloud-build.zip'
      - '.github/workflows/build-psp.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract source bundle
        run: |
          mkdir -p source
          unzip -q GTAVC-WIP9-cloud-build.zip -d source
          test -f source/GTAVC-WIP9-cloud-build/Makefile
      - name: Show PSP toolchain
        run: |
          echo "PSPDEV=${PSPDEV:-unset}"
          command -v psp-gcc
          command -v psp-g++
          command -v mksfoex
          command -v pack-pbp
      - name: Build EBOOT
        working-directory: source/GTAVC-WIP9-cloud-build
        run: |
          make clean || true
          make V=1
          test -s EBOOT.PBP
          file EBOOT.PBP || true
      - name: Upload EBOOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTAVC-PSP-diagnostic-EBOOT
          path: source/GTAVC-WIP9-cloud-build/EBOOT.PBP
          if-no-files-found: error
