name: Trace PSP START path

on:
  push:
    branches: [main]
    paths:
      - 'GTAVC-WIP9-cloud-build.zip'
      - '.github/workflows/trace-start-path.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source bundle
        uses: actions/checkout@v4
      - name: Extract and trace startup/menu code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q GTAVC-WIP9-cloud-build.zip -d extracted
          root="extracted/GTAVC-WIP9-cloud-build"
          echo "=== FILE LIST ==="
          find "$root/src" -type f -maxdepth 5 -print | sort
          echo "=== START / GAME INIT REFERENCES ==="
          grep -R -n -i -E 'start|game.?init|init.?game|bootstrap|mainloop|main_loop|revc' "$root/src" || true
          echo "=== ENGINE ENTRY SOURCE ==="
          if [ -f "$root/src/engine/revc_psp.c" ]; then
            sed -n '1,280p' "$root/src/engine/revc_psp.c"
          fi
          echo "=== PSP IMAGE/ASSET SOURCE ==="
          if [ -f "$root/src/psp/psp_img.c" ]; then
            sed -n '1,260p' "$root/src/psp/psp_img.c"
          fi
          echo "=== MAKEFILE ==="
          sed -n '1,220p' "$root/Makefile"
