name: reVC upstream host baseline

on:
  push:
    paths:
      - ".github/workflows/revc-host-baseline.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  host-baseline:
    name: Build upstream reVC on Linux (not PSP)
    runs-on: ubuntu-22.04
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            libsdl2-dev libopenal-dev libmpg123-dev libglfw3-dev \
            libglew-dev libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev
      - name: Check out upstream reVC
        uses: actions/checkout@v4
        with:
          repository: mrxenginner/reVC
          ref: miami
          path: upstream-reVC
          submodules: recursive
      - name: Record upstream revision
        working-directory: upstream-reVC
        run: |
          git rev-parse HEAD | tee ../revc-upstream-revision.txt
          git submodule status --recursive | tee ../revc-submodules.txt
      - name: Configure host build
        working-directory: upstream-reVC
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build host engine
        working-directory: upstream-reVC
        run: cmake --build build --parallel 2
      - name: Preserve source revision record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-host-baseline-source-record
          path: |
            revc-upstream-revision.txt
            revc-submodules.txt
          if-no-files-found: ignore
