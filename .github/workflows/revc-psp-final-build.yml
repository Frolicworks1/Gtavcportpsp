name: reVC PSP Final Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revc-psp-final-build.yml'
      - '.github/workflows/revc-psp-cross-compile-probe.yml'
      - 'scripts/patch_revc_psp.sh'
      - 'cmake/toolchains/psp-allegrex.cmake'
      - 'porting/librw-psp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PSP SDK
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          test -x "$PSPDEV/bin/psp-gcc"
          test -x "$PSPDEV/bin/psp-g++"
          command -v mksfoex
          command -v pack-pbp
          command -v psp-strip
          command -v psp-fixup-imports
          PSP_SDK_LIB="$(dirname "$(find "$PSPDEV/psp" -type f -name libpspgu.a -print -quit)")"
          test -n "$PSP_SDK_LIB"
          for lib in libpspgu.a libpspgum.a libpspctrl.a libpspge.a libpspdisplay.a; do test -s "$PSP_SDK_LIB/$lib"; done

      - name: Fetch pinned reVC
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/mrxenginner/reVC.git upstream-revc
          git -C upstream-revc checkout --detach a26fff4af555a8a425ac9f17d1dd718d00d1f942
          git -C upstream-revc submodule update --init --recursive

      - name: Apply PSP port
        shell: bash
        run: |
          set -euxo pipefail
          sh -n scripts/patch_revc_psp.sh
          mkdir -p upstream-revc/vendor/librw/src/psp
          cp porting/librw-psp/rwpsp.h upstream-revc/vendor/librw/src/psp/rwpsp.h
          cp porting/librw-psp/rwpsp.cpp upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          cp porting/librw-psp/rwpsp_plugins.cpp upstream-revc/vendor/librw/src/psp/rwpsp_plugins.cpp
          cp porting/librw-psp/psp_input.cpp upstream-revc/src/core/psp_input.cpp
          cp porting/librw-psp/psp_platform.cpp upstream-revc/src/skel/psp_platform.cpp
          cp porting/librw-psp/custompipes_psp.cpp upstream-revc/src/extras/custompipes_psp.cpp
          cp porting/librw-psp/rwpsp_plugins.cpp upstream-revc/vendor/librw/src/psp/rwpsp_plugins.cpp
          cp porting/librw-psp/psp_platform.cpp upstream-revc/src/skel/psp_platform.cpp
          cp porting/librw-psp/psp_input.cpp upstream-revc/src/core/psp_input.cpp
          cp porting/librw-psp/custompipes_psp.cpp upstream-revc/src/extras/custompipes_psp.cpp
          cp porting/librw-psp/psp_link_stubs.cpp upstream-revc/src/core/psp_link_stubs.cpp
          sh scripts/patch_revc_psp.sh | tee psp-patch.log
          mkdir -p upstream-revc/vendor/librw/src/psp
          cp porting/librw-psp/rwpsp.cpp upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          cp porting/librw-psp/rwpsp.h upstream-revc/vendor/librw/src/psp/rwpsp.h
          cp porting/librw-psp/rwpsp_plugins.cpp upstream-revc/vendor/librw/src/psp/rwpsp_plugins.cpp
          printf "\ntarget_sources(librw PRIVATE \\${CMAKE_CURRENT_SOURCE_DIR}/src/psp/rwpsp.cpp \\${CMAKE_CURRENT_SOURCE_DIR}/src/psp/rwpsp_plugins.cpp)\n" >> upstream-revc/vendor/librw/CMakeLists.txt
          cat >> upstream-revc/src/CMakeLists.txt <<'CMAKE_EOF'
          target_sources(reVC PRIVATE
  ${CMAKE_CURRENT_SOURCE_DIR}/core/psp_input.cpp
  ${CMAKE_CURRENT_SOURCE_DIR}/core/psp_link_stubs.cpp
  ${CMAKE_CURRENT_SOURCE_DIR}/skel/psp_platform.cpp
  ${CMAKE_CURRENT_SOURCE_DIR}/extras/custompipes_psp.cpp
)
CMAKE_EOF

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          PSP_SDK_LIB="$(dirname "$(find "$PSPDEV/psp" -type f -name libpspgu.a -print -quit)")"
          cmake -S upstream-revc -B build-revc-psp \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake" \
            -DRW_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fpermissive -include strings.h -DRW_PSP=1 -DM_SQRT2=1.4142135623730951 -I$PSPDEV/psp/sdk/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$PSP_SDK_LIB" \
            -DLIBRW_PLATFORM=NULL \
            -DREVC_WITH_OPUS=OFF \
            -DREVC_WITH_LIBSNDFILE=OFF | tee psp-cmake-configure.log

      - name: Link actual PSP ELF
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-revc-psp --parallel 2 2>&1 | tee psp-cross-compile.log

      - name: Package and validate EBOOT.PBP
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          BUILD_DIR="$GITHUB_WORKSPACE/build-revc-psp"
          PACKAGE_DIR="$BUILD_DIR/psp-package"
          mkdir -p "$PACKAGE_DIR"
          ELF="$(find "$BUILD_DIR" -type f -name 'reVC' -print -quit)"
          test -n "$ELF"
          test -s "$ELF"
          cp "$ELF" "$PACKAGE_DIR/reVC"
          "$PSPDEV/bin/psp-strip" "$PACKAGE_DIR/reVC"
          "$PSPDEV/bin/psp-fixup-imports" "$PACKAGE_DIR/reVC"
          test "$(od -An -tx1 -N4 "$PACKAGE_DIR/reVC" | tr -d ' \\n')" = "7f454c46"
          cd "$PACKAGE_DIR"
          "$PSPDEV/bin/mksfoex" -d MEMSIZE=1 "Grand Theft Auto: Vice City PSP" PARAM.SFO
          "$PSPDEV/bin/pack-pbp" EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL reVC NULL
          test -s EBOOT.PBP
          test "$(od -An -tx1 -N4 EBOOT.PBP | tr -d ' \\n')" = "50425000"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP"
          cp EBOOT.PBP PARAM.SFO reVC "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP/"

      - name: Upload final PSP package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-psp-final
          path: |
            artifacts/PSP/GAME/GTAVCPSP/EBOOT.PBP
            artifacts/PSP/GAME/GTAVCPSP/PARAM.SFO
            artifacts/PSP/GAME/GTAVCPSP/reVC
            psp-patch.log
            psp-cmake-configure.log
            psp-cross-compile.log
          if-no-files-found: warn

      - name: Upload native PSP ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reVC-PSP-ELF
          path: |
            upstream-revc/**/*.elf
            build/**/*.elf
          if-no-files-found: error

      - name: Create PSP EBOOT.PBP
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p eboot
          ELF="$(find upstream-revc build . -type f \( -name '*.elf' -o -name 'reVC' -o -name 'reVC.elf' \) -perm -111 | head -n 1 || true)"
          test -n "$ELF"
          test -s "$ELF"
          if command -v psp-fixup-imports >/dev/null 2>&1; then psp-fixup-imports "$ELF"; fi
          if command -v psp-strip >/dev/null 2>&1; then psp-strip "$ELF"; fi
          command -v pack-pbp >/dev/null 2>&1
          if command -v mksfoex >/dev/null 2>&1; then
            mksfoex "Grand Theft Auto: Vice City" eboot/PARAM.SFO
          else
            command -v mksfo >/dev/null 2>&1
            mksfo "Grand Theft Auto: Vice City" eboot/PARAM.SFO
          fi
          cp "$ELF" eboot/EBOOT.ELF
          pack-pbp eboot/EBOOT.PBP eboot/PARAM.SFO NULL NULL NULL NULL NULL eboot/EBOOT.ELF NULL
          test -s eboot/EBOOT.PBP
          test "$(dd if=eboot/EBOOT.PBP bs=1 count=4 2>/dev/null)" = "PBP\0"
          tar -czf reVC-PSP-EBOOT.tar.gz -C eboot EBOOT.PBP

      - name: Upload validated EBOOT
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reVC-PSP-EBOOT
          path: reVC-PSP-EBOOT.tar.gz
          if-no-files-found: error
