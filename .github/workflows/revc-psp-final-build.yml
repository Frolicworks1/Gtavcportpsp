name: reVC PSP Final Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revc-psp-final-build.yml'
      - '.github/workflows/revc-psp-cross-compile-probe.yml'
      - 'scripts/patch_revc_psp.sh'
      - 'cmake/toolchains/psp-allegrex.cmake'
      - 'porting/librw-psp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PSP SDK
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          test -x "$PSPDEV/bin/psp-gcc"
          test -x "$PSPDEV/bin/psp-g++"
          command -v mksfoex
          command -v pack-pbp
          command -v psp-strip
          command -v psp-fixup-imports
          PSP_SDK_LIB="$(dirname "$(find "$PSPDEV/psp" -type f -name libpspgu.a -print -quit)")"
          test -n "$PSP_SDK_LIB"
          for lib in libpspgu.a libpspgum.a libpspctrl.a libpspge.a libpspdisplay.a; do test -s "$PSP_SDK_LIB/$lib"; done

      - name: Fetch pinned reVC
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/mrxenginner/reVC.git upstream-revc
          git -C upstream-revc checkout --detach a26fff4af555a8a425ac9f17d1dd718d00d1f942
          git -C upstream-revc submodule update --init --recursive

      - name: Apply PSP port
        shell: bash
        run: |
          set -euxo pipefail
          sh -n scripts/patch_revc_psp.sh
          mkdir -p upstream-revc/vendor/librw/src/psp
          cp porting/librw-psp/rwpsp.h upstream-revc/vendor/librw/src/psp/rwpsp.h
          cp porting/librw-psp/rwpsp.cpp upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          cp porting/librw-psp/rwpsp_plugins.cpp upstream-revc/vendor/librw/src/psp/rwpsp_plugins.cpp
          cp porting/librw-psp/rwpsp_plugins.cpp upstream-revc/vendor/librw/src/psp/rwpsp_plugins.cpp
          sh scripts/patch_revc_psp.sh | tee psp-patch.log
          sed -i '/^file(GLOB_RECURSE /a if(RW_PSP)\n  list(REMOVE_ITEM ${PROJECT}_SOURCES ${CMAKE_CURRENT_SOURCE_DIR}/core/CdStream_posix.cpp)\nendif()' upstream-revc/src/CMakeLists.txt
          mkdir -p upstream-revc/vendor/librw/src/psp
          cp porting/librw-psp/rwpsp.cpp upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          cp porting/librw-psp/rwpsp.h upstream-revc/vendor/librw/src/psp/rwpsp.h
          cp porting/librw-psp/rwpsp_plugins.cpp upstream-revc/vendor/librw/src/psp/rwpsp_plugins.cpp
          printf '%s\n' 'target_sources(librw PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/src/psp/rwpsp_plugins.cpp)' >> upstream-revc/vendor/librw/CMakeLists.txt
          printf '%s\n' 'set_source_files_properties(${CMAKE_CURRENT_SOURCE_DIR}/charset.cpp PROPERTIES COMPILE_OPTIONS "-URW_NULL")' >> upstream-revc/vendor/librw/CMakeLists.txt
          cat >> upstream-revc/src/CMakeLists.txt <<'CMAKE_EOF'
          add_library(psp_runtime OBJECT
            $ENV{GITHUB_WORKSPACE}/porting/librw-psp/psp_input.cpp
            $ENV{GITHUB_WORKSPACE}/porting/librw-psp/psp_platform.cpp
            $ENV{GITHUB_WORKSPACE}/porting/librw-psp/psp_main.cpp
            $ENV{GITHUB_WORKSPACE}/porting/librw-psp/CdStream_psp.cpp
            $ENV{GITHUB_WORKSPACE}/porting/librw-psp/psp_missing_stubs.cpp
            $ENV{GITHUB_WORKSPACE}/porting/librw-psp/psp_custompipes_missing.cpp
          )
          target_include_directories(psp_runtime PRIVATE
            ${PROJECT_SOURCE_DIR}
            ${${PROJECT}_INCLUDES}
            ${CMAKE_SOURCE_DIR}/../porting/librw-psp
          )
          target_compile_definitions(psp_runtime PRIVATE
            LIBRW CMAKE_NO_AUTOLINK CMAKE_BUILD USE_OUR_VERSIONING RW_PSP=1
          )
          target_link_libraries(psp_runtime PRIVATE librw::librw Threads::Threads)
          target_link_libraries(reVC PRIVATE $<TARGET_OBJECTS:psp_runtime>)
          CMAKE_EOF

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          PSP_SDK_LIB="$(dirname "$(find "$PSPDEV/psp" -type f -name libpspgu.a -print -quit)")"
          cmake -S upstream-revc -B build-revc-psp \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake" \
            -DRW_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fpermissive -include strings.h -DRW_PSP=1 -DM_SQRT2=1.4142135623730951 -I$PSPDEV/psp/sdk/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$PSP_SDK_LIB" \
            -DLIBRW_PLATFORM=NULL \
            -DREVC_WITH_OPUS=OFF \
            -DREVC_WITH_LIBSNDFILE=OFF | tee psp-cmake-configure.log

      - name: Link actual PSP ELF
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-revc-psp --parallel 2 2>&1 | tee psp-cross-compile.log

      - name: Package and validate EBOOT.PBP
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          BUILD_DIR="$GITHUB_WORKSPACE/build-revc-psp"
          PACKAGE_DIR="$BUILD_DIR/psp-package"
          mkdir -p "$PACKAGE_DIR"
          ELF="$(find "$BUILD_DIR" -type f -name 'reVC' -print -quit)"
          test -n "$ELF"
          test -s "$ELF"
          cp "$ELF" "$PACKAGE_DIR/reVC"
          "$PSPDEV/bin/psp-strip" "$PACKAGE_DIR/reVC"
          if "$PSPDEV/bin/psp-fixup-imports" "$PACKAGE_DIR/reVC"; then
            printf "%s\n" "PSP import fixup applied"
          else
            printf "%s\n" "PSP import fixup skipped: retaining stripped ELF for early testing"
          fi
          test "$(od -An -tx1 -N4 "$PACKAGE_DIR/reVC" | tr -d ' \\n')" = "7f454c46"
          cd "$PACKAGE_DIR"
          "$PSPDEV/bin/mksfoex" -d MEMSIZE=1 "Grand Theft Auto: Vice City PSP" PARAM.SFO
          "$PSPDEV/bin/pack-pbp" EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL reVC NULL
          test -s EBOOT.PBP
          test "$(od -An -tx1 -N4 EBOOT.PBP | tr -d ' \\n')" = "00504250"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP"
          cp EBOOT.PBP PARAM.SFO reVC "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP/"

      - name: Upload final PSP package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-psp-final
          path: |
            artifacts/PSP/GAME/GTAVCPSP/EBOOT.PBP
            artifacts/PSP/GAME/GTAVCPSP/PARAM.SFO
            artifacts/PSP/GAME/GTAVCPSP/reVC
            psp-patch.log
            psp-cmake-configure.log
            psp-cross-compile.log
          if-no-files-found: warn

      - name: Upload native PSP ELF
        if: success() && hashFiles('upstream-revc/**/*.elf', 'build/**/*.elf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reVC-PSP-ELF
          path: |
            upstream-revc/**/*.elf
            build/**/*.elf
          if-no-files-found: warn
