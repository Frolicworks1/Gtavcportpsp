name: Audit real Vice City engine for PSP port

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-real-engine.yml'
      - 'UPSTREAM_ENGINE.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
      - name: Get pinned upstream Vice City engine source
        run: |
          git init upstream-revc
          cd upstream-revc
          git remote add origin https://github.com/re3fork/re3-miami-vita.git
          git fetch --depth 1 origin 5de9de0d8072c3644f6cb961160b0fd7bfb067fb
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive
          echo "Pinned upstream commit: $(git rev-parse HEAD)"
      - name: Inspect engine entry points and Vita-only dependencies
        shell: bash
        run: |
          set -uo pipefail
          cd upstream-revc
          echo '=== SOURCE FILE COUNT ==='
          find src -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.h' \) | wc -l
          echo '=== LICENSE FILES ==='
          find . -maxdepth 2 -iname 'license*' -o -iname 'copying*' | head -n 30
          echo '=== TARGET / PLATFORM DEFINES ==='
          grep -R -n -E 'PSP2|vita|vita2d|vitagl|Sce[A-Z]|arm-vita-eabi|TARGET|main\(' Makefile src/skel src/core 2>/dev/null | head -n 240 || true
          echo '=== ENGINE ENTRY / GAME INITIALIZATION ==='
          grep -R -n -E 'main\(|GameInit|RsEventHandler|CGame::Initialise|Idle\(' src/skel src/core 2>/dev/null | head -n 160 || true
          echo '=== COMPILER / LINK / OUTPUT ==='
          grep -n -E 'PREFIX|CFLAGS|LIBS|vpk|velf|vita-make|vita-elf' Makefile
          echo '=== PSP PORT STATUS ==='
          echo 'This upstream Makefile targets ARM Vita (PSP2), not PSP MIPS.'
          echo 'A PSP port requires a MIPS PSP backend, PSP-compatible renderer, audio/input replacements, and memory/performance adaptation.'
