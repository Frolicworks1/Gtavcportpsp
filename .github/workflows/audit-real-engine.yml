name: Audit real Vice City engine for PSP port

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-real-engine.yml'
      - 'UPSTREAM_ENGINE.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Fetch the pinned Vice City engine
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/mrxenginner/reVC.git upstream-revc
          git -C upstream-revc checkout --detach a26fff4af555a8a425ac9f17d1dd718d00d1f942
          git -C upstream-revc submodule update --init --recursive
          echo "Pinned upstream commit: $(git -C upstream-revc rev-parse HEAD)"

      - name: Audit build system, game entry points, and renderer seams
        shell: bash
        run: |
          set -uo pipefail
          cd upstream-revc
          echo '=== SOURCE / SUBMODULES ==='
          git submodule status || true
          find src -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.h' \) 2>/dev/null | wc -l
          echo '=== LICENSES ==='
          find . -maxdepth 3 \( -iname 'license*' -o -iname 'copying*' \) -type f | head -n 50
          echo '=== CMAKE OPTIONS AND TARGETS ==='
          grep -n -E 'project\(|option\(|add_subdirectory\(|add_executable\(|find_package\(|SDL|OPENGL|OpenGL|DIRECTX|D3D|PSP|VITA|PLATFORM' CMakeLists.txt | head -n 260 || true
          echo '=== GAME START / FRAME LOOP ==='
          grep -R -n -E 'int main\(|SDL_main|GameInit|CGame::Initialise|Idle\(|RsEventHandler|FrontendInit' src 2>/dev/null | head -n 220 || true
          echo '=== RENDERWARE / RENDERER BACKEND SEAMS ==='
          grep -R -n -E 'class .*Renderer|Create.*Renderer|RenderState|rw::Engine|RwEngine|OpenGL|gl[A-Z]|D3D|Im2D|Im3D|Raster' src librw 2>/dev/null | head -n 260 || true
          echo '=== PLATFORM / AUDIO / INPUT DEPENDENCIES ==='
          grep -R -n -E 'SDL_Init|SDL_PollEvent|SDL_GetTicks|SDL_Audio|Mix_|OpenAL|ALSA|pthread|std::thread|SDL_GetPrefPath|SDL_RWops' src 2>/dev/null | head -n 220 || true
          echo '=== PSP PORT GATE ==='
          echo 'This is a source audit, not a PSP build. PSP MIPS Allegrex still needs a native GU renderer and PSP platform/audio/input/filesystem adaptations.'

      - name: Preserve audit report
        if: always()
        run: |
          {
            echo '# Upstream source audit'
            echo
            echo 'Pinned engine: mrxenginner/reVC @ a26fff4af555a8a425ac9f17d1dd718d00d1f942'
            echo 'See this workflow log for dependency, entry-point, renderer, and platform search results.'
            echo 'This audit does not claim that a PSP EBOOT or playable port was built.'
          } > upstream-audit-summary.md
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-revc-audit-summary
          path: upstream-audit-summary.md
