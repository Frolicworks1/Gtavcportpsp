name: Inspect PSP source archive

on:
  push:
    branches: [main]
    paths:
      - 'GTAVC-WIP9-cloud-build.zip'
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: List repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f -not -path './.git/*' -print | sort
      - name: Inspect uploaded archive
        run: |
          set -e
          archive="GTAVC-WIP9-cloud-build.zip"
          if [ ! -f "$archive" ]; then
            echo "Archive not found: $archive"
            exit 1
          fi
          echo "Archive details:"
          file "$archive"
          unzip -l "$archive" | tee archive-listing.txt
          mkdir -p extracted
          unzip -q "$archive" -d extracted
          echo "Extracted file listing:"
          find extracted -maxdepth 5 -type f -print | sort | tee extracted-files.txt
          echo "Build-system files:"
          find extracted -type f \( -iname 'CMakeLists.txt' -o -iname 'Makefile' -o -iname '*.mk' -o -iname 'meson.build' -o -iname 'README*' -o -iname '*.yml' -o -iname '*.yaml' \) -print | sort
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psp-source-inspection
          path: |
            archive-listing.txt
            extracted-files.txt
          if-no-files-found: warn
