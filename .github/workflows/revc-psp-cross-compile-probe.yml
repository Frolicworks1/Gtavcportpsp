name: Build reVC PSP MIPS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revc-psp-cross-compile-probe.yml'
      - 'cmake/toolchains/psp-allegrex.cmake'
      - 'UPSTREAM_ENGINE.md'
      - 'scripts/patch_revc_psp.sh'
      - 'porting/librw-psp/**'

jobs:
  cross-compile-probe:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
      - name: Verify PSP toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          test -x "$PSPDEV/bin/psp-gcc"
          test -s "$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake"
          test -s "$GITHUB_WORKSPACE/porting/librw-psp/rwpsp.h"
          test -s "$GITHUB_WORKSPACE/porting/librw-psp/rwpsp.cpp"
          test -s "$GITHUB_WORKSPACE/porting/librw-psp/psp_input.cpp"
          test -x "$PSPDEV/bin/psp-g++"
          command -v mksfoex
          command -v pack-pbp
          command -v psp-strip
          command -v psp-fixup-imports
          PSP_SDK_LIB="$(dirname "$(find "$PSPDEV/psp" -type f -name libpspgu.a -print -quit)")"
          test -n "$PSP_SDK_LIB"
          test -s "$PSP_SDK_LIB/libpspgu.a"
          test -s "$PSP_SDK_LIB/libpspgum.a"
          test -s "$PSP_SDK_LIB/libpspctrl.a"
          test -s "$PSP_SDK_LIB/libpspge.a"
          test -s "$PSP_SDK_LIB/libpspdisplay.a"
      - name: Fetch pinned upstream engine and submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/mrxenginner/reVC.git upstream-revc
          git -C upstream-revc checkout --detach a26fff4af555a8a425ac9f17d1dd718d00d1f942
          git -C upstream-revc submodule update --init --recursive
      - name: Apply PSP RenderWare device scaffold
        shell: bash
        run: |
          set -euxo pipefail
          sh -n scripts/patch_revc_psp.sh
          mkdir -p upstream-revc/vendor/librw/src/psp
          cp porting/librw-psp/rwpsp.h upstream-revc/vendor/librw/src/psp/rwpsp.h
          cp porting/librw-psp/rwpsp.cpp upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          cp porting/librw-psp/psp_input.cpp upstream-revc/src/core/psp_input.cpp
          sh scripts/patch_revc_psp.sh 2>&1 | tee psp-patch.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Preflight patched PSP source
        shell: bash
        run: |
          set -euxo pipefail
          test -s upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          test -s upstream-revc/src/core/psp_input.cpp
          test -s upstream-revc/src/core/Pad.h
          grep -q 'psp/rwpsp.cpp' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -q '^[[:space:]]*ps2/' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -q '^[[:space:]]*d3d/' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -q '^[[:space:]]*gl/' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -n 'rwps2plg.h' upstream-revc/vendor/librw/rw.h upstream-revc/vendor/librw/src/engine.cpp
          grep -q '^#if defined RW_GL3 || defined RW_PSP$' upstream-revc/src/core/ControllerConfig.h
          ! grep -n '#ifndef RW_GL3#ifndef\|#if !defined RW_GL3 #\|RW_GL3 !defined' upstream-revc/src/core/ControllerConfig.h
          ! grep -q 'DIJOYSTATE2' upstream-revc/src/core/ControllerConfig.h
          grep -q 'JoyState' upstream-revc/src/core/ControllerConfig.h
          grep -Fq 'SetNewAttraction(CPedAttractor* pAttractor, const CVector& pos, float, float, int32);' upstream-revc/src/peds/Ped.h
          grep -Fq 'virtual void ComputeAttractPos(int32 qid, CVector& pos) const;' upstream-revc/src/peds/PedAttractor.h
          grep -Fq 'virtual void ComputeAttractHeading(int32 qid, float& heading) const;' upstream-revc/src/peds/PedAttractor.h
          grep -Fq 'static int32 TonightsEvent;' upstream-revc/src/renderer/Fluff.h
          grep -Fq 'int32 CFont::ButtonsSlot = -1;' upstream-revc/src/renderer/Font.cpp
          grep -Fq 'int32 CWaterCreatures::nNumActiveSeaLifeForms;' upstream-revc/src/renderer/WaterCreatures.cpp
          grep -Fq '#include <alloca.h>' upstream-revc/src/skel/crossplatform.cpp
          grep -Fq '#include <unistd.h>' upstream-revc/src/skel/crossplatform.cpp
          ! grep -n 'SetNewAttraction(CPedAttractor.*int);' upstream-revc/src/peds/Ped.h
          grep -Fq 'static int32 ChooseGangOccupation(int32);' upstream-revc/src/peds/Population.h
          grep -Fq 'static void PlaceGangMembers(ePedType, int32, CVector const&);' upstream-revc/src/peds/Population.h
          grep -Fq 'CPopulation::ChooseGangOccupation(int32 gangId)' upstream-revc/src/peds/Population.cpp
          awk '/^int32$/ { getline; if ($0 == "CPopulation::ChooseGangOccupation(int32 gangId)") found=1 } END { exit(found ? 0 : 1) }' upstream-revc/src/peds/Population.cpp
          grep -Fq 'CPopulation::PlaceGangMembers(ePedType pedType, int32 pedAmount' upstream-revc/src/peds/Population.cpp
          grep -Fq 'CPopulation::PlaceGangMembersInFormation(ePedType pedType, int32 pedAmount' upstream-revc/src/peds/Population.cpp
          grep -Fq 'CPopulation::PlaceGangMembersInCircle(ePedType pedType, int32 pedAmount' upstream-revc/src/peds/Population.cpp
          ! grep -Fq 'CPopulation::ChooseGangOccupation(int gangId)' upstream-revc/src/peds/Population.cpp
          ! grep -Fq 'CPopulation::PlaceGangMembers(ePedType pedType, int pedAmount' upstream-revc/src/peds/Population.cpp
          ! grep -Fq 'CPopulation::PlaceGangMembersInFormation(ePedType pedType, int pedAmount' upstream-revc/src/peds/Population.cpp
          ! grep -Fq 'CPopulation::PlaceGangMembersInCircle(ePedType pedType, int pedAmount' upstream-revc/src/peds/Population.cpp
          grep -q '#define RWDEVICE psp' upstream-revc/vendor/librw/src/rwbase.h
          grep -q 'PROJECT}_AUDIOS "NULL"' upstream-revc/CMakeLists.txt
          grep -q 'PROJECT}_AUDIO "NULL"' upstream-revc/CMakeLists.txt
          grep -q 'NOT RW_PSP AND NOT TARGET MPG123::libmpg123' upstream-revc/src/CMakeLists.txt
          grep -q 'add_library(MPG123::libmpg123 INTERFACE IMPORTED)' upstream-revc/src/CMakeLists.txt
          grep -q 'list(REMOVE_ITEM' upstream-revc/src/CMakeLists.txt
          grep -q 'audio/eax/eax-util.cpp' upstream-revc/src/CMakeLists.txt
          grep -q '^    pspgu$' upstream-revc/src/CMakeLists.txt
          grep -q '^    pspgum$' upstream-revc/src/CMakeLists.txt
          grep -q '^    pspctrl$' upstream-revc/src/CMakeLists.txt
          grep -q '^    pspge$' upstream-revc/src/CMakeLists.txt
          grep -q '^    pspdisplay$' upstream-revc/src/CMakeLists.txt
          grep -q '^if(RW_PSP)$' upstream-revc/vendor/librw/CMakeLists.txt
          grep -q 'set(LIBRW_PLATFORMS "PSP")' upstream-revc/vendor/librw/CMakeLists.txt
          grep -q 'psp/rwpsp.cpp' upstream-revc/vendor/librw/src/CMakeLists.txt
      - name: Configure native PSP build
        id: configure
        shell: bash
        run: |
          set -o pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          PSP_SDK_LIB="$(dirname "$(find "$PSPDEV/psp" -type f -name libpspgu.a -print -quit)")"
          test -n "$PSP_SDK_LIB"
          cmake -S upstream-revc -B build-revc-psp \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake" \
            -DRW_PSP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fpermissive -include strings.h -DRW_PSP=1 -DM_SQRT2=1.4142135623730951 -I$PSPDEV/psp/sdk/include" \
            -DLIBRW_PLATFORM=PSP \
            -DREVC_WITH_OPUS=OFF \
            -DREVC_WITH_LIBSNDFILE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-L$PSP_SDK_LIB" 2>&1 | tee psp-cmake-configure.log
      - name: Compile reVC for PSP
        if: steps.configure.outcome == 'success'
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-revc-psp --parallel 2 2>&1 | tee psp-cross-compile.log
      - name: Package and validate PSP EBOOT
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          BUILD_DIR="$GITHUB_WORKSPACE/build-revc-psp"
          PACKAGE_DIR="$BUILD_DIR/psp-package"
          mkdir -p "$PACKAGE_DIR"

          ELF="$(find "$BUILD_DIR" -type f -name 'reVC' -print -quit)"
          if [ -z "$ELF" ]; then
            ELF="$(find "$BUILD_DIR" -type f -name '*.elf' -print -quit)"
          fi
          test -n "$ELF"
          test -s "$ELF"
          printf 'ELF=%s\n' "$ELF"
          printf 'ELF_MAGIC='
          od -An -tx1 -N4 "$ELF"

          cp "$ELF" "$PACKAGE_DIR/reVC"
          "$PSPDEV/bin/psp-strip" "$PACKAGE_DIR/reVC"
          "$PSPDEV/bin/psp-fixup-imports" "$PACKAGE_DIR/reVC"
          test -s "$PACKAGE_DIR/reVC"

          cd "$PACKAGE_DIR"
          "$PSPDEV/bin/mksfoex" -d MEMSIZE=1 "Grand Theft Auto: Vice City PSP" PARAM.SFO
          test -s PARAM.SFO

          "$PSPDEV/bin/pack-pbp" EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL reVC NULL
          test -s EBOOT.PBP

          MAGIC="$(od -An -tx1 -N4 EBOOT.PBP | tr -d ' \n')"
          test "$MAGIC" = "50425000"
          ELF_MAGIC="$(od -An -tx1 -N4 reVC | tr -d ' \n')"
          test "$ELF_MAGIC" = "7f454c46"

          mkdir -p "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP"
          cp EBOOT.PBP "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP/EBOOT.PBP"
          cp PARAM.SFO "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP/PARAM.SFO"
          cp reVC "$GITHUB_WORKSPACE/artifacts/PSP/GAME/GTAVCPSP/reVC.elf"
          find "$GITHUB_WORKSPACE/artifacts" -type f -exec ls -lh {} \;
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-psp-build-diagnostics
          path: |
            psp-patch.log
            psp-cmake-configure.log
            psp-cross-compile.log
            artifacts/PSP/GAME/GTAVCPSP/EBOOT.PBP
            artifacts/PSP/GAME/GTAVCPSP/PARAM.SFO
            artifacts/PSP/GAME/GTAVCPSP/reVC.elf
          if-no-files-found: warn
