name: Build reVC PSP MIPS # PSP CdStream compatibility pass v4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revc-psp-cross-compile-probe.yml'
      - 'cmake/toolchains/psp-allegrex.cmake'
      - 'UPSTREAM_ENGINE.md'
      - 'scripts/patch_revc_psp.sh'
      - 'porting/librw-psp/**'

jobs:
  cross-compile-probe:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Verify PSP toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          test -x "$PSPDEV/bin/psp-gcc"
          test -x "$PSPDEV/bin/psp-g++"
          command -v mksfoex
          command -v pack-pbp

      - name: Fetch pinned upstream engine and submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/mrxenginner/reVC.git upstream-revc
          git -C upstream-revc checkout --detach a26fff4af555a8a425ac9f17d1dd718d00d1f942
          git -C upstream-revc submodule update --init --recursive

      - name: Apply PSP RenderWare device scaffold
        shell: bash
        run: |
          set -euxo pipefail
          sh -n scripts/patch_revc_psp.sh
          mkdir -p upstream-revc/vendor/librw/src/psp
          cp porting/librw-psp/rwpsp.h upstream-revc/vendor/librw/src/psp/rwpsp.h
          cp porting/librw-psp/rwpsp.cpp upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          sh scripts/patch_revc_psp.sh

      - name: Preflight patched PSP source
        shell: bash
        run: |
          set -euxo pipefail
          test -s upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          grep -q 'psp/rwpsp.cpp' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -q '^[[:space:]]*ps2/' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -q '^[[:space:]]*d3d/' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -q '^[[:space:]]*gl/' upstream-revc/vendor/librw/src/CMakeLists.txt
          ! grep -n 'rwps2plg.h' upstream-revc/vendor/librw/rw.h upstream-revc/vendor/librw/src/engine.cpp
          grep -q '^#if defined RW_GL3 || defined RW_PSP$' upstream-revc/src/core/ControllerConfig.h
          ! grep -n '#ifndef RW_GL3#ifndef|#if !defined RW_GL3 #|RW_GL3 !defined' upstream-revc/src/core/ControllerConfig.h
          ! grep -q 'DIJOYSTATE2' upstream-revc/src/core/ControllerConfig.h
          grep -q 'JoyState' upstream-revc/src/core/ControllerConfig.h
          grep -q 'PROJECT}_AUDIOS "NULL"' upstream-revc/CMakeLists.txt
          grep -q 'PROJECT}_AUDIO "NULL"' upstream-revc/CMakeLists.txt
          grep -q 'NOT RW_PSP AND NOT TARGET MPG123::libmpg123' upstream-revc/src/CMakeLists.txt
          grep -q 'add_library(MPG123::libmpg123 INTERFACE IMPORTED)' upstream-revc/src/CMakeLists.txt
          grep -q 'list(REMOVE_ITEM' upstream-revc/src/CMakeLists.txt
          grep -q 'audio/eax/eax-util.cpp' upstream-revc/src/CMakeLists.txt
          test "$(head -n 1 upstream-revc/src/audio/eax/eax-util.cpp)" = "#ifndef RW_PSP"
          grep -q 'CColStore::RemoveColSlot(int32 slot)' upstream-revc/src/collision/ColStore.cpp
          grep -q 'static int GetRandomNumberInRange(int low, int high)' upstream-revc/src/core/General.h
          grep -q 'static int32 GetRandomNumberInRange(int low, int32 high)' upstream-revc/src/core/General.h
          grep -q 'int32 CCarCtrl::NumLawEnforcerCars;' upstream-revc/src/control/CarCtrl.cpp
          grep -q 'CCarCtrl::RemoveFromLoadedVehicleArray(int32 mi, int32 rating)' upstream-revc/src/control/CarCtrl.cpp
          grep -q 'CPathFind::CalcNodeCoors(float x, float y, float z, int32 id' upstream-revc/src/control/PathFind.cpp
          grep -q 'CPathFind::PreparePathDataForType' upstream-revc/src/control/PathFind.cpp
          grep -Fq 'CPathInfoForObject *detachednodes, int32 numDetached' upstream-revc/src/control/PathFind.cpp
          grep -q '^int CPacManPickups::PillsEatenInRace;' upstream-revc/src/control/Pickups.cpp
          grep -q 'CCamera::TryToStartNewCamMode(int32 obbeMode)' upstream-revc/src/core/Camera.cpp
          grep -q 'psp_strdup' upstream-revc/src/core/CdStream_posix.cpp
          grep -q '^#if 0
          grep -q 'int32 CdStreamGetLastPosn(void);' upstream-revc/src/core/CdStream.h

      - name: Configure native PSP build
        id: configure
        shell: bash
        run: |
          set -o pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          cmake -S upstream-revc -B build-revc-psp             -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake"             -DRW_PSP=ON             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_FLAGS="-fpermissive -include strings.h -DRW_PSP=1 -I$PSPDEV/psp/sdk/include"             -DLIBRW_PLATFORM=NULL             -DREVC_WITH_OPUS=OFF             -DREVC_WITH_LIBSNDFILE=OFF 2>&1 | tee psp-cmake-configure.log

      - name: Compile reVC for PSP
        if: steps.configure.outcome == 'success'
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-revc-psp --parallel 2 2>&1 | tee psp-cross-compile.log

      - name: Package PSP EBOOT when executable exists
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          find build-revc-psp -type f \( -name '*.elf' -o -name '*.prx' -o -name 'reVC' \) -print
          test -n "$(find build-revc-psp -type f \( -name '*.elf' -o -name 'reVC' \) -print -quit)" 

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-psp-build-diagnostics
          path: |
            psp-patch.log
            psp-cmake-configure.log
            psp-cross-compile.log
          if-no-files-found: warn
 upstream-revc/src/core/Frontend.cpp
          grep -q '^#elif defined(RW_PSP) || defined(LIBRW_SDL2)
          grep -q 'int32 CdStreamGetLastPosn(void);' upstream-revc/src/core/CdStream.h

      - name: Configure native PSP build
        id: configure
        shell: bash
        run: |
          set -o pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          cmake -S upstream-revc -B build-revc-psp             -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake"             -DRW_PSP=ON             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_FLAGS="-fpermissive -include strings.h -DRW_PSP=1 -I$PSPDEV/psp/sdk/include"             -DLIBRW_PLATFORM=NULL             -DREVC_WITH_OPUS=OFF             -DREVC_WITH_LIBSNDFILE=OFF 2>&1 | tee psp-cmake-configure.log

      - name: Compile reVC for PSP
        if: steps.configure.outcome == 'success'
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-revc-psp --parallel 2 2>&1 | tee psp-cross-compile.log

      - name: Package PSP EBOOT when executable exists
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          find build-revc-psp -type f \( -name '*.elf' -o -name '*.prx' -o -name 'reVC' \) -print
          test -n "$(find build-revc-psp -type f \( -name '*.elf' -o -name 'reVC' \) -print -quit)" 

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-psp-build-diagnostics
          path: |
            psp-patch.log
            psp-cmake-configure.log
            psp-cross-compile.log
          if-no-files-found: warn
 upstream-revc/src/core/Frontend.cpp
          grep -q 'int32 CdStreamGetLastPosn(void);' upstream-revc/src/core/CdStream.h

      - name: Configure native PSP build
        id: configure
        shell: bash
        run: |
          set -o pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          cmake -S upstream-revc -B build-revc-psp             -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake"             -DRW_PSP=ON             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_FLAGS="-fpermissive -include strings.h -DRW_PSP=1 -I$PSPDEV/psp/sdk/include"             -DLIBRW_PLATFORM=NULL             -DREVC_WITH_OPUS=OFF             -DREVC_WITH_LIBSNDFILE=OFF 2>&1 | tee psp-cmake-configure.log

      - name: Compile reVC for PSP
        if: steps.configure.outcome == 'success'
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-revc-psp --parallel 2 2>&1 | tee psp-cross-compile.log

      - name: Package PSP EBOOT when executable exists
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          find build-revc-psp -type f \( -name '*.elf' -o -name '*.prx' -o -name 'reVC' \) -print
          test -n "$(find build-revc-psp -type f \( -name '*.elf' -o -name 'reVC' \) -print -quit)" 

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-psp-build-diagnostics
          path: |
            psp-patch.log
            psp-cmake-configure.log
            psp-cross-compile.log
          if-no-files-found: warn
