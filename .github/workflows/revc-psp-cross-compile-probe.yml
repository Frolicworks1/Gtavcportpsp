name: Probe pinned reVC with PSP MIPS toolchain
# PSP backend scaffold is patched into the pinned librw checkout during CI.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revc-psp-cross-compile-probe.yml'
      - 'cmake/toolchains/psp-allegrex.cmake'
      - 'UPSTREAM_ENGINE.md'
      - 'scripts/patch_revc_psp.sh'
      - 'porting/librw-psp/**'

jobs:
  cross-compile-probe:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
      - name: Verify PSP toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          test -x "$PSPDEV/bin/psp-gcc"
          test -x "$PSPDEV/bin/psp-g++"
          "$PSPDEV/bin/psp-gcc" --version
          "$PSPDEV/bin/psp-g++" --version
      - name: Fetch pinned upstream engine and submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/mrxenginner/reVC.git upstream-revc
          git -C upstream-revc checkout --detach a26fff4af555a8a425ac9f17d1dd718d00d1f942
          git -C upstream-revc submodule update --init --recursive
      - name: Apply PSP RenderWare device scaffold
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "Port HEAD: $(git rev-parse HEAD)"
          sh -n scripts/patch_revc_psp.sh
          mkdir -p upstream-revc/vendor/librw/src/psp
          cp porting/librw-psp/rwpsp.h upstream-revc/vendor/librw/src/psp/rwpsp.h
          cp porting/librw-psp/rwpsp.cpp upstream-revc/vendor/librw/src/psp/rwpsp.cpp
          sh scripts/patch_revc_psp.sh 2>&1 | tee psp-patch.log
      - name: Validate generated PSP CMake block
        shell: bash
        run: |
          set -euxo pipefail
          grep -A4 -B2 'if(RW_PSP)' upstream-revc/vendor/librw/src/CMakeLists.txt
          grep -A4 -B2 'if(RW_PSP)' upstream-revc/vendor/librw/src/CMakeLists.txt | grep -q 'endif()'

      - name: Apply temporary PSP header isolation for compile probe
        shell: bash
        run: |
          set -euxo pipefail
          true
          grep -n '^#include' upstream-revc/vendor/librw/rw.h
      - name: Inspect vendored PNG decoder types
        shell: bash
        run: |
          set -euxo pipefail
          grep -n -E 'uint32|unsigned|w[ ,].*h[ ;]' upstream-revc/vendor/librw/src/png.cpp | head -80 || true
      - name: Attempt native PSP cross-configuration
        id: configure
        shell: bash
        run: |
          set -o pipefail
          export PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          cmake -S upstream-revc -B build-revc-psp             -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/psp-allegrex.cmake"             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_FLAGS="-fpermissive -include strings.h -DRW_PSP=1 -I$PSPDEV/psp/sdk/include"             -DLIBRW_PLATFORM=NULL             -DREVC_WITH_OPUS=OFF             -DREVC_WITH_LIBSNDFILE=OFF 2>&1 | tee psp-cmake-configure.log
      - name: Attempt PSP compile if configuration succeeds
        if: steps.configure.outcome == 'success'
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-revc-psp --parallel 2 2>&1 | tee psp-cross-compile.log
      - name: Summarize outcome without hiding blockers
        if: always()
        shell: bash
        run: |
          {
            echo '# reVC PSP MIPS cross-compile probe'
            echo
            echo '- Port repository HEAD: '$(git rev-parse HEAD)
            echo '- Pinned upstream: mrxenginner/reVC @ a26fff4af555a8a425ac9f17d1dd718d00d1f942'
            echo '- PSP toolchain: pspdev/pspdev'
            echo '- PSP C++ compatibility probe: -fpermissive (temporary diagnostic aid)'
            echo '- CMake configure outcome: ${{ steps.configure.outcome }}'
            echo '- Compile step attempted only if CMake configuration succeeds'
            echo
            echo 'This is a feasibility probe, not a playable EBOOT. PSP GU renderer, platform layer, audio backend, and game-data support remain separate porting work.'
          } > psp-cross-compile-summary.md
      - name: Upload logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revc-psp-cross-compile-probe
          path: |
            psp-cross-compile-summary.md
            psp-patch.log
            psp-cmake-configure.log
            psp-cross-compile.log
          if-no-files-found: warn
